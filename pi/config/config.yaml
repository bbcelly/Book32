# InkDeck for Raspberry Pi: hardware and system configuration.
#
# This file holds the defaults and is replaced by updates. To change a value
# on your device, put just that value in config/local.yaml (same layout); it
# overrides this file and updates leave it alone. Reading and power settings
# you change in the web interface are kept in data/settings.json.

display:
  width: 480                  # Logical size after rotation (portrait)
  height: 800
  rotation: 90                # The 800 x 480 panel is mounted in portrait
  spi_hz: 10000000            # Panel SPI clock; 4000000 if the picture shows noise

library:
  books_directory: books      # Relative to the app folder; ~ is allowed

reader:
  page_cache_size: 3          # Rendered pages kept in memory

performance:
  gc_on_page_turn: true       # Collect garbage after each page turn (Pi Zero RAM)

logging:
  level: INFO                 # DEBUG, INFO, WARNING or ERROR
  file: logs/inkdeck.log      # Relative to the app folder
  max_bytes: 2000000          # Rotated at this size, with two old files kept
  console: true               # Also log to the console (journalctl)

web:
  port: 5000

buttons:
  toggle:
    pin: 5                    # BCM GPIO 5 (physical pin 29), button to GND
    pull: up
    bounce_time: 0.2          # Seconds
    long_press: 0.8           # Seconds held for a long press

keyboard:
  enabled: true               # Bluetooth or USB keyboard via evdev
  device_pattern: null        # Only use keyboards whose name contains this

battery:
  enabled: true               # Backend is detected: PiSugar 2, then ADS1115
  update_interval: 30         # Seconds between readings
  adc_channel: 0              # ADS1115 only
  voltage_divider_ratio: 2.0  # ADS1115 only
  min_voltage: 3.0            # ADS1115 only: empty
  max_voltage: 4.2            # ADS1115 only: full

pisugar:
  socket_path: /tmp/pisugar-server.sock
  button_enabled: true        # Accept button commands on the socket below
  button_socket_path: /tmp/inkdeck-button.sock

power:
  single_core_reading: true   # Take extra CPU cores offline while reading
